name: Reusable TypeScript Checks

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "20"
      package-manager:
        type: string
        default: "auto" # auto | bun | pnpm | npm
      pnpm-version:
        # Leave empty to let pnpm/action-setup read the "packageManager" field
        # from package.json. Only set this for repos that have no such field.
        type: string
        default: ""
      run-lint:
        type: boolean
        default: true
      run-tsc:
        type: boolean
        default: true
      run-prettier:
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect relevant file changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - '**/*.{ts,tsx,js,jsx,mjs,cjs}'
              - '**/package.json'
              - '**/pnpm-lock.yaml'
              # Holds pnpm's overrides/auditConfig as of pnpm 11, so it decides
              # what actually gets installed — a change here can alter the whole
              # dependency tree without touching package.json.
              - '**/pnpm-workspace.yaml'
              - '**/package-lock.json'
              - '**/bun.lock'
              - '**/bun.lockb'
              # Covers .prettierrc, .prettierrc.json, .prettierrc.mjs, ...
              - '**/.prettierrc*'
              # Covers prettier.config.js/.mjs/.cjs/.ts. The '**/' prefix also
              # matches at repo root, since ** matches zero path segments.
              - '**/prettier.config.*'
              # Decides which files the prettier step touches at all.
              - '**/.prettierignore'
              # Prettier reads it for indentation defaults.
              - '**/.editorconfig'
              - '**/tsconfig*.json'
              - '**/.eslintrc*'
              - '**/eslint.config.*'
              - '.github/workflows/**'

      - name: Debug changed-files decision
        run: echo "code=${{ steps.changes.outputs.code }}"

      - name: Stop early if no relevant changes
        if: steps.changes.outputs.code != 'true'
        run: echo "No TS/JS/tooling changes detected; skipping checks."

      - name: Verify git hooks path configured
        if: steps.changes.outputs.code == 'true'
        shell: bash
        run: |
          if [ ! -f ".githooks/pre-push" ]; then
            echo "::warning::No .githooks/pre-push found in this repo."
            echo "::warning::Developers won't be blocked locally before pushing."
          fi

      - name: Resolve package manager
        if: steps.changes.outputs.code == 'true'
        id: pm
        shell: bash
        run: |
          set -euo pipefail
          pm="${{ inputs.package-manager }}"
          if [ "$pm" = "auto" ]; then
            if [ -f bun.lockb ] || [ -f bun.lock ]; then
              pm="bun"
            elif [ -f pnpm-lock.yaml ]; then
              pm="pnpm"
            elif [ -f package-lock.json ]; then
              pm="npm"
            else
              echo "No supported lockfile found." >&2
              exit 1
            fi
          fi
          echo "value=$pm" >> "$GITHUB_OUTPUT"
          echo "Using package manager: $pm"

      # MUST run before actions/setup-node. `cache: pnpm` shells out to
      # `pnpm store path` to locate the cache directory, so pnpm has to already
      # be on PATH — otherwise setup-node dies with
      # "Unable to locate executable file: pnpm".
      #
      # No hardcoded `version:` either: pnpm/action-setup@v4 hard-errors when a
      # version input is given AND package.json has a "packageManager" field
      # that disagrees with it. Reading packageManager is also what keeps CI on
      # the same pnpm major the developers use locally.
      - name: Setup pnpm
        if: steps.changes.outputs.code == 'true' && steps.pm.outputs.value == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}

      # setup-node provides npm/pnpm cache
      - name: Setup Node (npm cache)
        if: steps.changes.outputs.code == 'true' && steps.pm.outputs.value == 'npm'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Node (pnpm cache)
        if: steps.changes.outputs.code == 'true' && steps.pm.outputs.value == 'pnpm'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # Bun strategy: cache Bun install cache + node_modules
      - name: Setup Bun
        if: steps.changes.outputs.code == 'true' && steps.pm.outputs.value == 'bun'
        uses: oven-sh/setup-bun@v2

      - name: Cache Bun dependencies
        if: steps.changes.outputs.code == 'true' && steps.pm.outputs.value == 'bun'
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies (npm)
        if: steps.changes.outputs.code == 'true' && steps.pm.outputs.value == 'npm'
        run: npm ci

      - name: Install dependencies (pnpm)
        if: steps.changes.outputs.code == 'true' && steps.pm.outputs.value == 'pnpm'
        run: pnpm install --frozen-lockfile

      - name: Install dependencies (bun)
        if: steps.changes.outputs.code == 'true' && steps.pm.outputs.value == 'bun'
        run: bun install --frozen-lockfile

      - name: Lint
        if: steps.changes.outputs.code == 'true' && inputs.run-lint
        run: |
          case "${{ steps.pm.outputs.value }}" in
            bun) bun run lint ;;
            pnpm) pnpm run lint ;;
            npm) npm run lint ;;
          esac

      # Was `<pm> run tsc --noEmit`, which fails with "Missing script: tsc" in
      # every repo that names the script `typecheck`. Prefer the repo's own
      # script; fall back to invoking the tsc binary directly.
      - name: TypeScript compile
        if: steps.changes.outputs.code == 'true' && inputs.run-tsc
        shell: bash
        run: |
          set -euo pipefail
          has_script() {
            node -e "const s=require('./package.json').scripts||{}; process.exit(s['$1'] ? 0 : 1)"
          }
          case "${{ steps.pm.outputs.value }}" in
            bun)
              if has_script typecheck; then bun run typecheck; else bunx tsc --noEmit; fi
              ;;
            pnpm)
              if has_script typecheck; then pnpm run typecheck; else pnpm exec tsc --noEmit; fi
              ;;
            npm)
              if has_script typecheck; then npm run typecheck; else npx tsc --noEmit; fi
              ;;
          esac

      - name: Ensure .prettierignore exists
        if: steps.changes.outputs.code == 'true' && inputs.run-prettier
        shell: bash
        run: |
          if [ ! -f .prettierignore ]; then
            echo "No .prettierignore found, creating default."
            cat > .prettierignore << 'EOF'
          # Auto-generated by CanPixel CI
          .github/
          node_modules/
          dist/
          build/
          EOF
          else
            echo ".prettierignore already exists, skipping."
          fi

      - name: Prettier fixes
        if: steps.changes.outputs.code == 'true' && inputs.run-prettier
        run: |
          case "${{ steps.pm.outputs.value }}" in
            bun) bunx prettier --write . ;;
            pnpm) pnpm exec prettier --write . ;;
            npm) npx prettier --write . ;;
          esac

      - name: Commit formatting fixes
        # Skipped on pull_request: the checkout is a detached merge commit, so
        # there is no branch to push back to.
        if: >-
          steps.changes.outputs.code == 'true' && inputs.run-prettier &&
          github.event_name != 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-fix prettier formatting [skip ci]"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          skip_dirty_check: false
